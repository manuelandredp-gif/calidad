name: TestGenAI Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Typecheck & Vitest Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificación Estricta de Tipado (TypeScript)
        run: npm run typecheck

      - name: Análisis Estático de Código (ESLint)
        run: npm run lint

      - name: Ejecutar Pruebas Automatizadas Unitarias & Heurísticas
        run: npm test

  security-scan:
    name: Escaneo de Seguridad SAST & Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Escaneo de Vulnerabilidades en Dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  docker-verify:
    name: Verificación de Build de Contenedores Docker
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Sintaxis de Docker Compose
        run: docker compose -f docker-compose.enterprise.yml config
