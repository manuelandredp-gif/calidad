services:
  postgres:
    image: postgres:16-alpine
    container_name: testgenai_postgres
    restart: always
    environment:
      POSTGRES_DB: calidad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calidad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: testgenai_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/calidad_db?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/calidad_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET aleatorio}
      ACCESS_TOKEN_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      AI_PROVIDER_DEFAULT: gemini
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-3.1-flash-lite}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Configure URL publica HTTPS}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
