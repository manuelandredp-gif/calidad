version: '3.8'

services:
  # Base de Datos PostgreSQL 16 con extensión pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: testgenai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: testgenai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword2026!}
      POSTGRES_DB: testgenai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgenai -d testgenai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Distribuido Redis para BullMQ y Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: testgenai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisPassword2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPassword2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Backend API Core & Motor Heurístico
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testgenai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://testgenai:${POSTGRES_PASSWORD:-SecretPassword2026!}@postgres:5432/testgenai_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPassword2026!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-SuperSecretEnterpriseKey2026!TestGenAI}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRefreshKey2026!TestGenAI}
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"

  # Reverse Proxy Nginx & Frontend SPA
  nginx:
    image: nginx:alpine
    container_name: testgenai-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
